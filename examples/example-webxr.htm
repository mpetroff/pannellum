<!DOCTYPE HTML>
<html>
<head>
    <title>Pannellum WebXR VR Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/pannellum.css">
    <script src="/src/js/libpannellum.js"></script>
    <script src="/src/js/pannellum.js"></script>
    <script src="/src/js/pannellum.xr.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        var viewer = pannellum.viewer('container', {
            "default": {
                "firstScene": "pond",
                "author": "Matthew Petroff",
                "autoLoad": true
            },
            "scenes": {
                "pond": {
                    "title": "Jordan Pond (Equirectangular)",
                    "type": "equirectangular",
                    "panorama": "/examples/examplepano.jpg",
                    "preview": "/examples/examplepano-preview.jpg",
                    "hotSpots": [
                        {
                            "pitch": 0,
                            "yaw": -30,
                            "type": "info",
                            "text": "Welcome to Jordan Pond!"
                        },
                        {
                            "pitch": -5,
                            "yaw": 30,
                            "type": "scene",
                            "text": "Go to Jordan Pond (Cube)",
                            "sceneId": "pondCube"
                        }
                    ]
                },
                "pondCube": {
                    "title": "Jordan Pond (Cube)",
                    "type": "cubemap",
                    "cubeMap": [
                        "/examples/examplepanocube0.jpg",
                        "/examples/examplepanocube1.jpg",
                        "/examples/examplepanocube2.jpg",
                        "/examples/examplepanocube3.jpg",
                        "/examples/examplepanocube4.jpg",
                        "/examples/examplepanocube5.jpg"
                    ],
                    "hotSpots": [
                        {
                            "pitch": 0,
                            "yaw": 100,
                            "type": "scene",
                            "text": "Go back to Jordan Pond",
                            "sceneId": "pond"
                        }
                    ]
                }
            }
        });
    </script>
</body>
</html>
